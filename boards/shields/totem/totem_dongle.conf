CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_KEYBOARD_NAME="TOTEM"
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y

# +8 dBm TX on the central only. This is a controller-wide setting, so on a
# battery half it raises the cost of every transmission; the dongle is USB
# powered, so here it is free. It is also the only lever on the dongle->half
# direction, which the halves' own TX power cannot affect.
#
# Measured with nRF Connect, phone at each half, dongle at each candidate spot
# (dongle at +8 dBm, worst observed fade):
#   monitor stand: left -68 dBm, right -67 dBm
#   under table:   left -52 dBm, right -66 dBm
# Under-table was chosen. Allowing 8 dB for the halves dropping to 0 dBm and
# ~5 dB for the XIAO chip antenna vs the phone, that estimates to -65 dBm
# (left) and -79 dBm (right) at the dongle -- 30 dB and 16 dB above the
# nRF52840's -95 dBm sensitivity. The right half is the limiting link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery reporting disabled to match the halves.
#
# The dongle has no cell, but xiao_ble still sets zmk,battery = &vbatt, so with
# reporting on it would sample a divider with nothing attached and publish the
# result to the host as the keyboard's battery level. Disabling it also drops
# BT_BAS, which is only `imply`d by ZMK_BATTERY_REPORTING, so no battery service
# is advertised at all.
#
# ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING / _PROXY default to n and are
# deliberately left unset. Do not enable FETCHING while the halves have
# reporting off: central.c only treats a peripheral as fully subscribed once it
# has also found a BAS battery-level characteristic, so every connection would
# enumerate the peripheral's full characteristic range instead of stopping early.
CONFIG_ZMK_BATTERY_REPORTING=n

#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_LOG_MODE_IMMEDIATE=n
#CONFIG_LOG_TIMESTAMP_64BIT=y
#CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
#CONFIG_ZMK_LOG_LEVEL_DBG=y
#CONFIG_INPUT_LOG_LEVEL_INF=y

CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_ZMK_BOOTMODE_MAGIC_VALUE_BOOTLOADER_TYPE_ADAFRUIT_NRF52=y