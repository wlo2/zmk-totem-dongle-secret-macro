name: Build and Push Prebaked image and Settings Reset

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build and Push Prebaked image and Settings Reset'
        required: false
        default: 'Manual settings reset needed'

# Deliberately WITHOUT cancel-in-progress. This workflow pushes
# ghcr.io/<owner>/zmk-zephyr:latest, which every other workflow uses as its
# build container -- cancelling mid-push can leave a broken manifest on :latest
# and break all builds. Grouping still prevents two dispatches racing the same
# tag; a second run queues behind the first instead.
concurrency:
  group: ${{ github.workflow }}

jobs:
  build-image:
    name: Build and push prebaked Zephyr image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zmk-zephyr
          tags: |
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/${{ github.repository_owner }}/zmk-zephyr:latest
    name: Build settings_reset firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: West Build (settings_reset)
        working-directory: /opt/zmk-env
        run: |
          west build -s zmk/app -b xiao_ble -- \
            -DZMK_CONFIG=${GITHUB_WORKSPACE}/config \
            -DSHIELD=settings_reset

      - name: Create firmware artifact
        working-directory: /opt/zmk-env
        run: |
          mkdir -p firmware
          if [ -f build/zephyr/zmk.uf2 ]; then
            cp build/zephyr/zmk.uf2 firmware/settings_reset.uf2
          else
            echo "Error: zmk.uf2 not found"
            exit 1
          fi

      - name: Upload settings reset firmware
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          # archive: false (new in v7) uploads the single file unzipped, so the
          # download is settings_reset.uf2 directly rather than a zip to extract.
          # Only valid for a single file, and it makes the filename the artifact
          # name -- `name:` is ignored, so it is omitted here.
          archive: false
          path: /opt/zmk-env/firmware/settings_reset.uf2
          retention-days: 30

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Settings reset firmware"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`settings_reset.uf2\` |"
            echo "| Artifact | [direct download](${{ steps.artifact.outputs.artifact-url }}) |"
            echo "| SHA-256 | \`${{ steps.artifact.outputs.artifact-digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"