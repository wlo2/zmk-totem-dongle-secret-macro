name: Build ZMK firmware

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      include_settings_reset:
        description: 'Build firmware using pre-baked image'
        required: false
        default: false
        type: boolean

jobs:
  matrix:
    runs-on: ubuntu-latest
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - name: Configure Git Default Branch
        run: |
          git config --global init.defaultBranch main
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Build Matrix
        run: |
          echo "build_matrix=$(yq -oj -I0 'build.yaml')" >> $GITHUB_ENV
          yq -oj "build.yaml"

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/zmk-zephyr:core-move-to-zephyr-4-1
    needs: matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Always checkout external modules (no cache since you update them frequently)
      - name: Checkout zmk_autocorrect module
        uses: actions/checkout@v4
        with:
          repository: wlo2/zmk_autocorrect
          ref: main
          path: zmk_autocorrect

      - name: Checkout zmk-antecedent-morph module
        uses: actions/checkout@v4
        with:
          repository: ssbb/zmk-antecedent-morph
          ref: v1
          path: zmk-antecedent-morph

      # Use fixed build directory for caching
      - name: Create build directory
        run: |
          echo "build_dir=${GITHUB_WORKSPACE}/build-${{ matrix.board }}-${{ matrix.shield }}" >> $GITHUB_ENV

      - name: Prepare variables
        shell: sh -x {0}
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          artifact_name: ${{ matrix.artifact-name }}
          snippet: ${{ matrix.snippet }}
        run: |
          # Use pre-baked west workspace inside the container image
          echo "base_dir=/opt/zmk-env" >> $GITHUB_ENV
          echo "ZEPHYR_BASE=/opt/zmk-env/zephyr" >> $GITHUB_ENV
          echo "ZMK_AUTOCORRECT_PATH=${GITHUB_WORKSPACE}/zmk_autocorrect" >> $GITHUB_ENV
          echo "ANTE_MORPH_PATH=${GITHUB_WORKSPACE}/zmk-antecedent-morph" >> $GITHUB_ENV
          export zmk_load_arg=" -DZMK_EXTRA_MODULES='${GITHUB_WORKSPACE};${GITHUB_WORKSPACE}/zmk_autocorrect;${GITHUB_WORKSPACE}/zmk-antecedent-morph'"

          if [ -n "${snippet}" ]; then
            extra_west_args="-S \"${snippet}\""
          fi

          echo "zephyr_version=${ZEPHYR_VERSION}" >> $GITHUB_ENV
          echo "extra_west_args=${extra_west_args}" >> $GITHUB_ENV
          echo "extra_cmake_args=${shield:+-DSHIELD=\"$shield\"}${zmk_load_arg}" >> $GITHUB_ENV
          echo "display_name=${shield:+$shield - }${board}" >> $GITHUB_ENV
          echo "artifact_name=${artifact_name:-${shield:+$shield-}${board}-zmk}" >> $GITHUB_ENV

      - name: Verify Zephyr tree
        run: |
          set -eux
          echo "ZEPHYR_BASE=${ZEPHYR_BASE}"
          test -d "${ZEPHYR_BASE}" || (echo "Missing ZEPHYR_BASE dir" && exit 1)
          ls -al "${ZEPHYR_BASE}" | head -n 50 || true
          test -f "${ZEPHYR_BASE}/share/zephyr-package/cmake/ZephyrConfig.cmake" || (echo "Missing ZephyrConfig.cmake under ${ZEPHYR_BASE}/share/zephyr-package/cmake" && exit 1)

      - name: Skip copying into pre-baked workspace (no-op)
        run: echo "Using repo via ZMK_EXTRA_MODULES and config from GITHUB_WORKSPACE"

      - name: Generate secret macro overlays
        run: |
          echo "Generating secret macro overlays..."
          
          # Create config directory
          mkdir -p "${GITHUB_WORKSPACE}/config"
          
          # Make the converter script executable
          chmod +x "${GITHUB_WORKSPACE}/.github/workflows/string_to_zmk.sh"
          
          # Function to generate a macro
          generate_macro() {
            local secret_value="$1"
            local macro_name="$2"
            local output_file="$3"
            local fallback_text="$4"
            
            if [ -z "$secret_value" ]; then
              echo "Warning: $macro_name secret not set or empty"
              echo "Creating fallback macro that outputs: $fallback_text"
              
              # Convert fallback text to bindings
              BINDINGS=$("${GITHUB_WORKSPACE}/.github/workflows/string_to_zmk.sh" "$fallback_text")
              
              printf "behaviors {\n" > "$output_file"
              printf "    %s: %s {\n" "$macro_name" "$macro_name" >> "$output_file"
              printf "        compatible = \"zmk,behavior-macro\";\n" >> "$output_file"
              printf "        #binding-cells = <0>;\n" >> "$output_file"
              echo "        bindings = <$BINDINGS>;" >> "$output_file"
              printf "        wait-ms = <10>;\n" >> "$output_file"
              printf "        tap-ms = <10>;\n" >> "$output_file"
              printf "    };\n" >> "$output_file"
              printf "};\n" >> "$output_file"
              
              echo "Fallback $macro_name created (types '$fallback_text')"
            else
              echo "$macro_name secret found, converting string to bindings"
              
              # Check if the secret is already in binding format (starts with &)
              if echo "$secret_value" | grep -q '^&'; then
                echo "Secret appears to be in binding format already, using as-is"
                BINDINGS="$secret_value"
              else
                echo "Converting string to ZMK bindings using external script..."
                BINDINGS=$("${GITHUB_WORKSPACE}/.github/workflows/string_to_zmk.sh" "$secret_value")
                
                if [ $? -ne 0 ] || [ -z "$BINDINGS" ]; then
                  echo "Error: Failed to convert string to bindings for $macro_name"
                  exit 1
                fi
              fi
              
              # Create the secret macro
              printf "behaviors {\n" > "$output_file"
              printf "    %s: %s {\n" "$macro_name" "$macro_name" >> "$output_file"
              printf "        compatible = \"zmk,behavior-macro\";\n" >> "$output_file"
              printf "        #binding-cells = <0>;\n" >> "$output_file"
              echo "        bindings = <$BINDINGS>;" >> "$output_file"
              printf "        wait-ms = <10>;\n" >> "$output_file"
              printf "        tap-ms = <10>;\n" >> "$output_file"
              printf "    };\n" >> "$output_file"
              printf "};\n" >> "$output_file"
              
              echo "Custom $macro_name created successfully"
            fi
            
            # Verify the generated file
            if [ -f "$output_file" ]; then
              echo "$macro_name overlay file generated"
              
              # Basic syntax validation
              if grep -q "behaviors {" "$output_file" && \
                 grep -q "$macro_name:" "$output_file" && \
                 grep -q "bindings = <" "$output_file"; then
                echo "Overlay file structure validation passed for $macro_name"
              else
                echo "Error: Generated overlay file has invalid structure for $macro_name"
                exit 1
              fi
            else
              echo "Error: Failed to create $output_file"
              exit 1
            fi
          }
          
          # Generate first secret macro
          generate_macro "${{ secrets.STRING_PLACEHOLDER }}" "secret_macro" "${GITHUB_WORKSPACE}/config/secret_macro.overlay" "SECRET"
          
          # Generate second secret macro
          generate_macro "${{ secrets.STRING_PLACEHOLDER2 }}" "secret_macro2" "${GITHUB_WORKSPACE}/config/secret_macro2.overlay" "SECRET2"
          

        env:
          STRING_PLACEHOLDER: ${{ secrets.STRING_PLACEHOLDER }}
          STRING_PLACEHOLDER2: ${{ secrets.STRING_PLACEHOLDER2 }}

      # Note: GitHub Actions caches have a fixed 7-day retention for unused caches.
      # This cannot be changed. Caches are kept alive by accessing them regularly.
      # If you need longer retention, consider using artifacts instead (configurable up to 90 days).
      
      # Cache build artifacts - keymap changes invalidate, module changes don't
      # (since you update modules frequently and want fresh builds with them)
      - name: Cache West build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build-${{ matrix.board }}-${{ matrix.shield }}
          key: west-build-${{ matrix.board }}-${{ matrix.shield }}-${{ hashFiles('config/*.conf', 'config/*.keymap', 'config/*.dtsi') }}-v1
          restore-keys: |
            west-build-${{ matrix.board }}-${{ matrix.shield }}-

      - name: West Build (${{ env.display_name }})
        working-directory: /opt/zmk-env
        shell: sh -x {0}
        env:
          ZEPHYR_BASE: ${{ env.ZEPHYR_BASE }}
        run: west build -s zmk/app -d "${{ env.build_dir }}" -b "${{ matrix.board }}" ${{ env.extra_west_args }} -- -DZMK_CONFIG=${GITHUB_WORKSPACE}/config -DZephyr_DIR=${ZEPHYR_BASE}/share/zephyr-package/cmake ${{ env.extra_cmake_args }} ${{ matrix.cmake-args }}

      - name: ${{ env.display_name }} Kconfig file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/.config" ]
          then
            grep -v -e "^#" -e "^$" "${{ env.build_dir }}/zephyr/.config" | sort
          else
            echo "No Kconfig output"
          fi
        if: ${{ !cancelled() }}

      - name: Rename artifacts
        shell: sh -x {0}
        run: |
          mkdir "${{ env.build_dir }}/artifacts"
          if [ -f "${{ env.build_dir }}/zephyr/zmk.uf2" ]
          then
            cp "${{ env.build_dir }}/zephyr/zmk.uf2" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"
          elif [ -f "${{ env.build_dir }}/zephyr/zmk.bin" ]
          then
            cp "${{ env.build_dir }}/zephyr/zmk.bin" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.bin"
          fi

      - name: Archive (${{ env.display_name }})
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: Merge Output Artifacts
    steps:
      - name: Get formatted timestamp for archive name
        id: timestamp_generator
        run: |
          formatted_time=$(date -u +%d%m%Y_%H%M)
          echo "ARTIFACT_NAME=zmk_$formatted_time" >> $GITHUB_OUTPUT

      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ steps.timestamp_generator.outputs.ARTIFACT_NAME }}
          pattern: artifact-*
          delete-merged: true